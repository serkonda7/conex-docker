services:
  conex:
    image: ${CONEX_IMAGE:-conex}:${CONEX_TAG:-latest}
    build:
      context: .
      target: conex
      args:
        CONEX_VERSION: ${CONEX_VERSION:-main}
    environment:
      CONEX_DATABASE_URL: postgres://conex:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/conex
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - conex-data:/opt/conex/data
      - type: bind
        source: ./config.toml
        target: /etc/conex/config.toml
        read_only: true
        bind:
          create_host_path: false

  conex-web:
    image: ${CONEX_IMAGE:-conex}-web:${CONEX_TAG:-latest}
    build:
      context: .
      target: conex-web
      args:
        CONEX_VERSION: ${CONEX_VERSION:-main}
    environment:
      CONEX_HOST: ${CONEX_HOST:-localhost}
      CONEX_TLS: ${CONEX_TLS:-auto}
    restart: unless-stopped
    depends_on:
      conex:
        condition: service_healthy
    volumes:
      - conex-web-data:/data

  # Optional, enable with the agfeo-ldap profile (see README).
  agfeo-ldap:
    image: ${CONEX_IMAGE:-conex}-agfeo-ldap:${CONEX_TAG:-latest}
    build:
      context: .
      target: agfeo-ldap
      args:
        CONEX_VERSION: ${CONEX_VERSION:-main}
    profiles: [agfeo-ldap]
    environment:
      AGFEO_LDAP_BASE_DN: ${AGFEO_LDAP_BASE_DN:-ou=contacts,dc=conex}
      AGFEO_LDAP_TLS_CERT: ${AGFEO_LDAP_TLS_CERT:-}
      AGFEO_LDAP_TLS_KEY: ${AGFEO_LDAP_TLS_KEY:-}
      AGFEO_LDAP_DEBUG: ${AGFEO_LDAP_DEBUG:-}
    restart: unless-stopped
    depends_on:
      conex:
        condition: service_healthy

  postgres:
    image: docker.io/postgres:17-alpine
    environment:
      POSTGRES_USER: conex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: conex
    restart: unless-stopped
    volumes:
      - conex-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  conex-data:
  conex-web-data:
  conex-postgres-data:
