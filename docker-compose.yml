services:
  conex:
    image: ${CONEX_IMAGE:-conex}:${CONEX_TAG:-latest}
    build:
      context: .
      target: conex
      args:
        CONEX_VERSION: ${CONEX_VERSION:-dev-netbox}
    env_file: env/conex.env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - conex-data:/opt/conex/data
      - type: bind
        source: ./config.toml
        target: /etc/conex/config.toml
        read_only: true
        bind:
          create_host_path: false

  conex-web:
    image: ${CONEX_IMAGE:-conex}-web:${CONEX_TAG:-latest}
    build:
      context: .
      target: conex-web
      args:
        CONEX_VERSION: ${CONEX_VERSION:-dev-netbox}
    env_file: env/conex-web.env
    restart: unless-stopped
    depends_on:
      conex:
        condition: service_healthy
    volumes:
      - conex-web-data:/data

  postgres:
    image: docker.io/postgres:17-alpine
    env_file: env/postgres.env
    restart: unless-stopped
    volumes:
      - conex-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  conex-data:
  conex-web-data:
  conex-postgres-data:
